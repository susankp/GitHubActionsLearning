name: Test Workflow 

on: push

jobs:
  Test_Job1:
    name: Test Job
    runs-on: windows-latest
    env:
      DRIVER: 'RemoteWebDrivers'

    steps:
      - run: echo "This is running inside a ${{runner.name}} server in GitHub"
      - name: Check out source code
        uses: actions/checkout@v7.0.1
      - run: echo "HEllO!!!"
      - name: Execute during failure
        if: ${{failure()}}
        run: echo "One of the step failed"
      - name: Run Selenium Test
        if: ${{env.DRIVER == 'RemoteWebDriver'}}
        run: echo "Inside if condition"
      

  Test_Job2:
    name: Test Job 2
    runs-on: ubuntu-latest
    needs: Test_Job1
    if: always()
    steps:
      - run: echo "This is from 2nd Job"
    
